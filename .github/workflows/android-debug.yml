name: Build Android Debug (APK)

# Produces an UNSIGNED-for-store, debug-signed APK for on-device testing
# (sideload). No Play Store, no keystore secrets. Meant for the RevenueCat
# "Test Store" loop: the RevenueCat key is injected at build time from the
# workflow input, so it is never committed to the repo.
#
# TEST_MODE stays true in this build, so the on-device 🧪 switcher
# (OFF/FREE/PREMIUM/PRO) is available to exercise the gating instantly, and
# setting it to OFF lets you test the real (simulated) purchase flow.
#
# Trigger: Actions tab → "Build Android Debug (APK)" → Run workflow → paste
# your RevenueCat Test Store public key (test_...). Download the APK from the
# run's Artifacts and install it on your phone.

on:
  workflow_dispatch:
    inputs:
      revenuecat_key:
        description: 'RevenueCat Test Store public key (test_...). Leave blank to build without billing.'
        required: false
        default: ''

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Exposed as env (not read straight from secrets) so the optional
      # Firebase step below can decide, in an `if:`, whether it is configured.
      # Empty when the secret is unset → the whole distribution step is skipped
      # and the build is unaffected.
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject RevenueCat key (build-time only)
        env:
          RC_KEY: ${{ github.event.inputs.revenuecat_key }}
        run: |
          if [ -n "$RC_KEY" ]; then
            echo "::add-mask::$RC_KEY"
            node -e "const f='js/billing.js';const fs=require('fs');let s=fs.readFileSync(f,'utf8');const k=process.env.RC_KEY;s=s.replace(/const REVENUECAT_ANDROID_API_KEY = '';/, \"const REVENUECAT_ANDROID_API_KEY = '\"+k+\"';\");fs.writeFileSync(f,s);"
            echo "RevenueCat key injected."
          else
            echo "No key provided — billing stays disabled (web/demo fallback)."
          fi

      - name: Build web assets + sync to Android
        run: npm run sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Unique version so manual test builds are distinguishable in App Tester.
      # The "-test" suffix sets them apart from the auto main-loop builds.
      - name: Stamp version (App Tester distinguishability)
        run: |
          VN="1.${{ github.run_number }}-test"
          VC="${{ github.run_number }}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VN}\"/" android/app/build.gradle
          echo "Version stamped: ${VN} (${VC})"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anitracker-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # --- Level 2: cloud distribution (optional) ----------------------------
      # Pushes the freshly built APK to Firebase App Distribution so testers in
      # the "internal" group get a notification and install straight from their
      # phone — no USB, no artifact download.
      #
      # OPTIONAL BY DESIGN: the step is skipped entirely when FIREBASE_APP_ID is
      # unset, so the current build is never broken. To enable it, add two repo
      # secrets (Settings → Secrets and variables → Actions):
      #   FIREBASE_APP_ID          e.g. 1:1234567890:android:abcdef012345
      #   FIREBASE_SERVICE_ACCOUNT the full JSON of a service account key with
      #                            the "Firebase App Distribution Admin" role
      # See store/distribution.md for the console walkthrough.
      - name: Distribute to Firebase App Distribution (optional)
        if: ${{ env.FIREBASE_APP_ID != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_APP_ID is set but FIREBASE_SERVICE_ACCOUNT is missing — skipping distribution."
            exit 0
          fi
          SA_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          npx --yes firebase-tools@13 appdistribution:distribute \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "internal" \
            --release-notes "Debug build ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"
          rm -f "$SA_FILE"
